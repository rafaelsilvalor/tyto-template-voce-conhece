name: voce-conhece
version: 0.5.1
# The engineering brand of the private brand kit (Tyto TYTO-611): its logo, signature and accent.
# Without that brand in the installed kit, the logo and the signature are placeholders.
brand: engenharia
description: A "do you know the difference" carousel at 1080×1350 — a cover with the question, explanation slides with coloured highlights and pictures among the lines, and a sign-off.
# Every face the slides set is declared, so the plugin's process can measure them (Tyto ADR 0048).
# CircularXX is licensed: it crosses only under the manifest's `font:CircularXX`, approved at
# install. `tests/faces.test.ts` holds this list equal to the faces the examples draw.
#
# A glyph CircularXX lacks (Δ, ∇, ℏ, ², ·) is drawn in Tyto's bundled symbol chain (Tyto ADR
# 0168): Noto Sans Math, then Source Sans 3 at the nearest of its 400 and 700. They are listed
# so the plugin's own measure splits a formula the way the host draws it; the faces test derives
# the Source Sans 3 weights from the weights the examples draw.
faces:
  - { family: CircularXX, weight: 300 }
  - { family: CircularXX, weight: 400 }
  - { family: CircularXX, weight: 500 }
  - { family: CircularXX, weight: 700 }
  - { family: CircularXX, weight: 900 }
  - { family: Noto Sans Math, weight: 400 }
  - { family: Source Sans 3, weight: 400 }
  - { family: Source Sans 3, weight: 700 }
fonts:
  CircularXX: { alternatives: [Inter, Manrope, DM Sans] }
formats: [grid]
slots:
  # The cover's picture, 1080 × 1350, full bleed under the words. In the frontmatter:
  # `fundo: ./arte.png`. Without it the cover is the deep colour, flat.
  fundo: { type: image }
  # The pictures an explanation slide shows (a chart, a formula), each where it is written among
  # the slide's lines (Tyto ADR 0160), in questao-estrategica's frame, as tall as its own shape
  # makes it (Tyto ADR 0158). After the slide's `::lamina`, `::imagem ./figura.png`; the
  # indented lines under it go on.
  imagem: { type: image, per: lamina, multiple: true }
  # One slide each, in order. The cover is `::lamina {capa}`: its first line the lead, the rest
  # the title. An unmarked `::lamina` is an explanation: each line one paragraph, `**x**` a
  # highlight and `{cor:azul|vermelho|verde|ocre}x{/}` a coloured one. The sign-off is
  # `::lamina {fecho}`: empty, or one line that replaces its title. `::lamina {titulo}` is an
  # explanation whose first line is a title. `max` counts slides.
  lamina: { type: rich-text, repeat: true, min: 1, max: 10 }
adjustments:
  capa: { type: flag, applies: [lamina] }
  fecho: { type: flag, applies: [lamina] }
  # On an explanation, its first line is a title, set as the cover's (Black, capitals), in
  # `slide-title-color`; its `{cor:…}` marks keep their colours.
  titulo: { type: flag, applies: [lamina] }
  # On an `::imagem` line, `::imagem {sem-quadro} ./foto.png`: that picture without the frame.
  sem-quadro: { type: flag, applies: [imagem] }
# What a configuration may change (Tyto ADR 0153). Each default is the reference art's, but for
# the accent, which is the brand kit's when one is installed (Tyto ADR 0155): its default here is
# a neutral stand-in. `tests/values.test.ts` pins every default to the code's fallback.
values:
  # The cover's and the sign-off's colour, where no picture covers it; the explanation's logo,
  # its arrow and the border of its pictures' frames.
  deep: { type: color, default: '#204e72' }
  # The cover's picture for every brief of a configuration, full bleed under the words; a
  # brief's own `fundo` wins over it. No default: without both, the cover is `deep`.
  cover-background: { type: image }
  # The cover's title, its button and the sign-off's title, when no brand kit gives one.
  accent: { type: color, default: '#1d9ad5' }
  # An explanation's `{titulo}`, the deep colour: never the brand kit's accent. A `{cor:…}` in it
  # keeps its own `mark-cor-*` colour; `**x**` changes nothing visible in a Black heading.
  slide-title-color: { type: color, default: '#204e72' }
  # The words and icons on the deep colour.
  on-deep: { type: color, default: '#ffffff' }
  # The paper of the explanation slides.
  paper: { type: color, default: '#ffffff' }
  # The explanation's words, and the signature on paper.
  body-ink: { type: color, default: '#4d4d4d' }
  # `**x**`: its colour and its weight (one of the faces above), under the names every template
  # shares (Tyto `docs/template-conventions.md`, TYTO-554).
  highlight-color: { type: color, default: '#4d4d4d' }
  # A weight between the faces is set at the nearest one.
  highlight-weight: { type: number, default: 500, min: 300, max: 900 }
  # The four `{cor:…}` highlights, set at the highlight's weight.
  mark-cor-azul: { type: color, default: '#2f628a' }
  mark-cor-vermelho: { type: color, default: '#873131' }
  mark-cor-verde: { type: color, default: '#39902e' }
  mark-cor-ocre: { type: color, default: '#8a662d' }
  # The cover's title is set at the largest size between these that keeps it in its room, so a
  # short title grows and a long one shrinks. Below the floor it overflows, reported.
  title-floor: { type: length, default: 56, min: 32, max: 94.23 }
  title-ceiling: { type: length, default: 94.23, min: 56, max: 140 }
  # The explanation's paragraphs the same way: the reference's 40 px unless they do not fit.
  body-floor: { type: length, default: 30, min: 20, max: 40 }
  body-ceiling: { type: length, default: 40, min: 30, max: 64 }
  # The cover's lead: the reference's size, smaller to stay on one line; at the floor it wraps.
  lead-floor: { type: length, default: 32, min: 24, max: 47.11 }
  lead-ceiling: { type: length, default: 47.11, min: 32, max: 72 }
  # An explanation's `{titulo}`: the largest size at which no word runs past the paragraphs.
  slide-title-floor: { type: length, default: 40, min: 28, max: 56 }
  slide-title-ceiling: { type: length, default: 56, min: 40, max: 94.23 }
  # How far under its fitted size a title may go to keep a word off a line of its own, never
  # under its floor, and the most letter spacing, in em, a title or paragraph may take for the
  # same (Tyto ADR 0167). The paragraphs keep the size they share.
  orphan-shrink: { type: number, default: 0.08, min: 0, max: 0.25 }
  orphan-tracking: { type: number, default: 0.01, min: 0, max: 0.05 }
